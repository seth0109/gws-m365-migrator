[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gws-m365-migrator"
version = "0.1.0"
description = "Google Workspace to Microsoft 365 migration tool"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
    "google-auth-httplib2>=0.2.0",
    "msal>=1.28.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "tenacity>=8.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[project.scripts]
migrator = "migrator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/migrator"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
